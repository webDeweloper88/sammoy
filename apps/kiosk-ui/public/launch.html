<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LABRIX WASH</title><style>body{margin:0;min-height:100vh;display:grid;place-content:center;background:#0c1722;color:#fff;font:24px sans-serif;text-align:center}button{font:inherit;padding:20px;margin:20px}</style><main><p id="message">LABRIX WASH — запуск…</p><button id="retry">Повторить / Qayta urinish</button></main><script>
async function launch(){try{const response=await fetch('/api/commissioning/state',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!response.ok)throw Error();const state=await response.json();if(typeof state.complete!=='boolean')throw Error();location.replace(state.complete?'/wash':'/install')}catch{document.getElementById('message').textContent='Сервис запускается / Xizmat ishga tushmoqda…';setTimeout(launch,3000)}}document.getElementById('retry').onclick=launch;launch();
</script></html>
