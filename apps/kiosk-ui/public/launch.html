<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LABRIX — Ishga tushmoqda</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#12364a,#071824 70%);color:#f2f8fc;font:20px system-ui,sans-serif;text-align:center;overflow:hidden}main{padding:32px}img{width:110px;height:130px;object-fit:contain}h1{margin:14px 0 10px;font-size:48px;letter-spacing:.03em}p{color:#b2cad9;line-height:1.6}.progress{width:180px;height:3px;overflow:hidden;border-radius:5px;background:#ffffff15;margin:34px auto}.progress::before{content:"";display:block;width:45%;height:100%;background:#00b7ec;animation:slide 1.8s ease-in-out infinite}@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(325%)}}@media(prefers-reduced-motion:reduce){.progress::before{animation:none;transform:translateX(65%)}}button{border:1px solid #426071;border-radius:12px;background:#123044;color:#e5f4fc;font:inherit;padding:12px 24px;cursor:pointer}</style><main><img src="/assets/theme2/brand/labrix_mark_L.png" alt=""><h1>LABRIX</h1><p id="message">Ishga tushmoqda…<br>Система запускается</p><div class="progress" aria-hidden="true"></div><button id="retry">Повторить / Qayta urinish</button></main><script>
async function launch(){try{const response=await fetch('/api/commissioning/state',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!response.ok)throw Error();const state=await response.json();if(typeof state.complete!=='boolean')throw Error();location.replace(state.complete?'/wash':'/install')}catch{document.getElementById('message').textContent='Сервис запускается / Xizmat ishga tushmoqda…';setTimeout(launch,3000)}}document.getElementById('retry').onclick=launch;launch();

</script></html>
