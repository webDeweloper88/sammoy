server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $wash_engine wash-engine:8080;
  # Polling stays out of technical logs; error_log remains enabled.
  access_log off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;
  location /assets/kiosk/ {
    proxy_pass http://$wash_engine$request_uri;
  }

  location @setup_redirect {
    add_header Cache-Control "no-store" always;
    return 302 /install;
  }

  location @launch_redirect {
    add_header Cache-Control "no-store" always;
    return 302 /launch;
  }

  location = /_customer_access {
    internal;
    proxy_pass http://$wash_engine/api/kiosk/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  location = / {
    auth_request /_customer_access;
    error_page 403 = @setup_redirect;
    error_page 500 502 503 504 = @launch_redirect;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location = /wash {
    auth_request /_customer_access;
    error_page 403 = @setup_redirect;
    error_page 500 502 503 504 = @launch_redirect;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location = /wash/ { return 302 /wash; }

  location = /_commissioning_access {
    internal;
    proxy_pass http://$wash_engine/api/commissioning/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Commissioning-Client-IP $remote_addr;
  }

  # Public boolean only: a commissioned clone can show the completed screen.
  location = /api/commissioning/state {
    add_header Cache-Control "no-store" always;
    proxy_pass http://$wash_engine$request_uri;
    proxy_set_header Host $host;
  }

  location /api/commissioning/ {
    auth_request /_commissioning_access;
    proxy_pass http://$wash_engine$request_uri;
    proxy_set_header X-Commissioning-Client-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://$wash_engine$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /install. {
    return 302 /install;
  }

  location = /launch {
    try_files /launch.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
