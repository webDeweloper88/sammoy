server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;
  location /assets/kiosk/ {
    proxy_pass http://wash-engine:8080/assets/kiosk/;
  }

  location = /_commissioning_access {
    internal;
    proxy_pass http://wash-engine:8080/api/commissioning/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Commissioning-Client-IP $remote_addr;
  }

  location /api/commissioning/ {
    auth_request /_commissioning_access;
    proxy_pass http://wash-engine:8080/api/commissioning/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://wash-engine:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
