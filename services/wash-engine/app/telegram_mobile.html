<!doctype html><html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LABRIX · Telegram</title><style nonce="__NONCE__">
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#10293a;background:#edf4f8}*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center}main{width:min(100%,520px);background:white;border:1px solid #c8dbe5;border-radius:20px;padding:28px;box-shadow:0 16px 45px #10293a15}header{color:#087cab;font-weight:800;letter-spacing:.06em}h1{font-size:26px}p{line-height:1.6}label{display:grid;gap:10px;font-weight:600}.field{display:flex;border:1px solid #a6c1d0;border-radius:10px;overflow:hidden;margin-top:10px}input{min-width:0;width:100%;border:0;padding:16px;font:16px monospace}button{min-height:52px;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}#reveal{background:#edf4f8;border-radius:0}#submit{width:100%;background:#087cab;color:white;font-weight:700;margin-top:20px}button:disabled{opacity:.55}#status{padding:14px;border-radius:10px;background:#edf4f8;overflow-wrap:anywhere}#status:empty{display:none}.note{font-size:14px;color:#496676}a{color:#087cab}@media(prefers-color-scheme:dark){:root{color-scheme:dark;color:#edf6fa;background:#071824}main{background:#102938;border-color:#345165}input{background:#102938}#reveal,#status{background:#193c4e;color:#edf6fa}.note{color:#b1cbd9}a{color:#54ceff}}
</style></head><body><main><header>LABRIX · TELEGRAM</header><h1 id="title"></h1><p id="hint"></p><p><a href="https://t.me/BotFather" target="_blank" rel="noopener noreferrer" id="botfather">BotFather ↗</a></p><form id="form"><label for="token">BotFather token</label><div class="field"><input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="256" required><button id="reveal" type="button"></button></div><button id="submit" type="submit"></button></form><p id="status" role="status"></p><p class="note" id="note"></p></main><script nonce="__NONCE__">
const language=document.documentElement.lang;
const words={ru:['Подключить Telegram','Откройте BotFather, создайте бота и скопируйте токен. Вставьте его здесь — на экране поста вводить ничего не нужно.','Показать','Скрыть','Проверить и подключить','Проверяем токен…','Бот подключён: @','Вернитесь к экрану поста и привяжите владельца отдельным QR-кодом.','Одноразовая ссылка действует 10 минут. Телефон должен оставаться в сети поста.','Не удалось подключить бота. Проверьте токен и интернет.'],uz:['Telegramni ulash','BotFather orqali bot yarating va tokenni nusxalang. Uni shu yerga joylashtiring — post ekranida kiritish shart emas.','Ko‘rsatish','Yashirish','Tekshirish va ulash','Token tekshirilmoqda…','Bot ulandi: @','Post ekraniga qayting va egasini alohida QR orqali ulang.','Bir martalik havola 10 daqiqa amal qiladi. Telefon post tarmog‘ida qolishi kerak.','Botni ulab bo‘lmadi. Token va internetni tekshiring.'],en:['Connect Telegram','Create a bot in BotFather, copy its token and paste it here. No typing on the station screen is needed.','Show','Hide','Verify and connect','Checking token…','Bot connected: @','Return to the station and pair the owner using a separate QR code.','This single-use link expires after 10 minutes. Keep the phone on the station network.','Could not connect. Check the token and internet.']}[language]||[];
const el=id=>document.getElementById(id),input=el('token'),submit=el('submit');
el('title').textContent=words[0];el('hint').textContent=words[1];el('reveal').textContent=words[2];submit.textContent=words[4];el('note').textContent=words[8];
el('reveal').onclick=()=>{input.type=input.type==='password'?'text':'password';el('reveal').textContent=input.type==='password'?words[2]:words[3]};
el('form').onsubmit=async event=>{event.preventDefault();submit.disabled=true;el('status').textContent=words[5];try{const response=await fetch(location.pathname+'/configure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:input.value.trim()}),signal:AbortSignal.timeout(60000)});const body=await response.json();if(!response.ok){if([403,410].includes(response.status)){input.value='';input.disabled=true;submit.hidden=true;}throw Error(typeof body.detail==='string'?body.detail:words[9])}input.value='';el('form').hidden=true;el('status').textContent=words[6]+body.bot_username;el('note').textContent=words[7]}catch(error){el('status').textContent=error.message;submit.disabled=false}};
window.addEventListener('pagehide',()=>{input.value=''});
</script></body></html>
