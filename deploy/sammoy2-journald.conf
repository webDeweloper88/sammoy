# Docker uses journald, sharing this bounded technical-log budget.
# Calendar-month expiry is enforced by sammoy2-log-retention.timer.
[Journal]
Storage=persistent
SystemMaxUse=256M
RuntimeMaxUse=64M
SystemKeepFree=2G
SystemMaxFileSize=16M
MaxFileSec=1day
MaxRetentionSec=32day
RateLimitIntervalSec=30s
RateLimitBurst=2000
