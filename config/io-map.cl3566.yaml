# Cash input stays disabled until commissioning acceptance.
rfid:
  enabled: true
  events_max: 100
  poll_timeout_seconds: 0.25
  release_timeout_seconds: 0.75
  transport: hsu
  device: /dev/ttyS9
  baud_rate: 115200
transport:
  type: modbus-rtu
  device: /dev/ttyS7
  baud_rate: 9600
  data_bits: 8
  parity: none
  stop_bits: 1
  slave_address: 1
  auto_assign_factory_address: true
  response_timeout_ms: 250
bill_acceptor:
  enabled: false
  source: vendor-sysfs
  reader: level-process
  active_low: true
# IN1 pause; IN2 trigger; IN3–IN8 water/osmos/nano/foam/wax/chem.
inputs:
- name: pause_button
  address: 0
  active_low: false
  debounce_ms: 40
- name: total_stop
  address: 1
  active_low: true
  debounce_ms: 40
- name: mode_water
  address: 2
  active_low: false
  debounce_ms: 40
- name: mode_osmos
  address: 3
  active_low: false
  debounce_ms: 40
- name: mode_nano
  address: 4
  active_low: false
  debounce_ms: 40
- name: mode_foam
  address: 5
  active_low: false
  debounce_ms: 40
- name: mode_wax
  address: 6
  active_low: false
  debounce_ms: 40
- name: mode_chem
  address: 7
  active_low: false
  debounce_ms: 40
outputs:
- name: water
  address: 0
- name: osmos
  address: 1
- name: nano
  address: 2
- name: foam
  address: 3
- name: wax
  address: 4
- name: chem
  address: 5
- name: vacuum
  address: 6
- name: air
  address: 7
safety:
  startup_all_off: true
  shutdown_all_off: true
  readback_after_write: true
  controller_watchdog_ms: 2000
device_type: wash
